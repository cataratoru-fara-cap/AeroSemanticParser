broader_semantic_only:
  - broader: encyclopedia
    narrower: urban-dictionary
    evidence: invisible
    rationale: >-
      a crowdsourced slang dictionary — "encyclopedia" is a loose fit but
      the closest existing umbrella; flag for a dedicated "dictionary"
      umbrella if more slug-reference sites are added later

contested: []          # no co-occurrence statistic is possible for a
                        # single-valued field — see header

demoted: []

do_not_encode_as_broader:
  - pair: [avengers-endgame, marvel-comics]
    relation: >-
      produced-by / part-of a franchise, not is-a — Avengers: Endgame is not
      a KIND of Marvel Comics, it is a film Marvel produced

crosscutting_qualifiers: []   # no adjectival origin qualifiers identified

missing_umbrellas:
  - note: >-
      Countries/locations (united-states, japan, ...), franchises
      (the-simpsons, star-wars, ...), companies (nintendo, valve, ...) and
      people (donald-trump) are deliberately NOT given a parent here — see
      the file header. Revisit only if a real query need for e.g.
      "all country-of-origin concepts" shows up; until then a forced
      "country"/"franchise"/"company"/"person" umbrella would be
      unreviewed guesswork, not curation.
