  - {qid: Q11471,   label: time, rationale: "'at the time', 'over time'"}
  - {qid: Q8171,    label: word, rationale: "'the word X': the word itself is the frame's own item"}
  - {qid: Q1969448, label: term, rationale: "'the term X refers to'"}
  - {qid: Q170198,  label: series (mathematics), rationale: "belt and braces over entity_senses.yaml"}
