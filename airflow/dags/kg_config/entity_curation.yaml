# Curation rules for the entity layer (modules/kg/curation.py; gap 09).
#
# Every Wikidata item linked from a frame's About or tags is either KEPT or
# DROPPED for the knowledge graph (everything stays in Mongo). Rules decide
# the clear cases, in this order, first match wins:
#    1. linked from the title, or the frame's own item        -> keep
#    2. deny_items                                            -> drop
#    3. platform_items, or a class in platform_classes        -> keep
#    4. format_items                                          -> keep
#    5. also linked from the title                            -> keep
#    6. linked from both a tag AND the About                  -> keep
#    7. an About mention of a DIRECT class in deny_classes    -> drop
#    8. a whole tag whose item's label is capitalised         -> keep
#    9. an About mention of a generic_items item              -> drop
#   10. anything else                                         -> the LLM judge
# Platform classes match through the whole class tree (the P279 closure of
# the item's P31 types, plus its own P279 closure: t-shirt has no P31);
# deny classes match on direct classes only (curation.ClassIndex says why).
#
# Gabi (2026-09-28): platforms and communities are relevant and are kept by
# rule, without asking the judge. Umbrella concepts like "internet meme" go
# to the judge. Class labels are written here because many class items are
# not in the lexicon (no Wikipedia article).
#
# 2026-09-29 (curation 1.1.0), from the first review (200 links read) and
# the judge's first 6,260 frames: the judge kept generic words used in
# passing ("image", "social media", "man") about a third of the time and
# dropped relevant ones, and the anatomy class dropped tags ("muscles") and
# body parts the title names. So: meme formats are kept by rule, generic
# words met only in the About are dropped by rule (the title and tags still
# keep them, rules 5, 6, 8), and denied classes apply to the About only,
# after the title and tags have had their say.
#
# This file's sha256 is a curation stamp: editing it re-curates every frame
# (rules only — the judge's verdicts are kept per item and not re-asked).

platform_classes:
  - {qid: Q6576792,   label: online community}
  - {qid: Q3220391,   label: social networking service}
  - {qid: Q559856,    label: online video platform}
  - {qid: Q984179,    label: imageboard}
  - {qid: Q2721136,   label: image hosting service}
  - {qid: Q3963243,   label: social news website}
  - {qid: Q122759350, label: user-generated content platform}
  - {qid: Q92438,     label: microblogging}
  - {qid: Q102336293, label: live streaming service}
  - {qid: Q59152282,  label: video streaming service}
  # NOT "website" (Q35127): it covers BuzzFeed, Kotaku and The Verge, cited
  # as sources. NOT "very large online platform": it covers Wikipedia.

platform_items:
  # platforms whose Wikidata classes miss every class above
  - {qid: Q15718485,  label: Twitter, rationale: "P31 is 'overview' and 'management' (2026-09 dump)"}
