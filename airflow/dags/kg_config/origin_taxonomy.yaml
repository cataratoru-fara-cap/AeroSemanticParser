# origin_taxonomy.yaml — canonicalization + platform hierarchy for `origin`
# ============================================================================
# `frame.from` (parsed field `origin`) is KYM's free-text infobox "Origin"
# line — NOT a platform field. Querying the real corpus directly (23,882
# entries, 2026-09-17) shows it holds genuine platforms (Twitter, YouTube,
# 4chan...), countries (United States, Japan...), franchises (The Simpsons,
# Avengers: Endgame...), companies (Nintendo, Valve...), games (Elden
# Ring...) and people (Donald Trump). `aliases:` below canonicalizes the
# real duplication found in the top ~200 most frequent raw values, across
# EVERY one of those categories — not just platform-name casing. It is
# curated over the head of the distribution (roughly the top 150-250 raw
# strings by frequency, covering the large majority of entries by volume);
# the long tail of ~5,700 rarer values is left to kg/origin.py's
# deterministic slugify fallback, which still mints each one its own node
# rather than collapsing them into a lossy "Other".
#
# Below `aliases:`, the file switches to entry_type_taxonomy.yaml's bucket
# shape (`broader_confirmed`, `broader_semantic_only`, ...), parsed by the
# SAME code (kg/taxonomy.py's `_parse`, via kg/origin.py) — but populated
# ONLY with canonical slugs that are actually platforms (twitter, 4chan,
# youtube, ...). A country, franchise, company or person has no single
# natural parent; giving one a fake umbrella would be exactly the
# fabricated relation entry_type_taxonomy.yaml's own `demoted` /
# `do_not_encode_as_broader` buckets exist to reject. Those origin concepts
# get deduplication via `aliases:` and nothing else — no forced hierarchy.
#
# No PMI/co-occurrence evidence is possible for this field, unlike
# entry_type's: `origin` is ONE STRING PER FRAME (kg/census.py's
# `FieldSpec(multi_valued=False)`), so two origin values never co-occur —
# there is no statistic to agree or disagree with a semantic judgement.
# Every hierarchy edge below is judgement alone (`evidence: curated`), and
# `contested` (stats vs. semantics disagreement) is structurally empty for
# this reason, not because nothing was reviewed.

