# Airflow cluster configuration for CeleryExecutor with Redis, PostgreSQL, and MongoDB.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# AIRFLOW_IMAGE_NAME           - Docker image name used to run Airflow.
#                                Default: apache/airflow:|version|
# AIRFLOW_UID                  - User ID in Airflow containers
#                                Default: 50000
# AIRFLOW_PROJ_DIR             - Base path to which all the files will be volumed.
#                                Default: .
# Those configurations are useful mostly in case of standalone testing/running Airflow in test/try-out mode
#
# _AIRFLOW_WWW_USER_USERNAME   - Username for the administrator account (if requested).
#                                Default: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - Password for the administrator account (if requested).
#                                Default: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - Additional PIP requirements to add when starting all containers.
#                                Use this option ONLY for quick checks. Installing requirements at container
#                                startup is done EVERY TIME the service is started.
#                                A better way is to build a custom image or extend the official image
#                                as described in https://airflow.apache.org/docs/docker-stack/build.html.
#                                Default: ''
#
# Feel free to modify this file to suit your needs.
---
x-airflow-common:
  &airflow-common
  # In order to add custom dependencies or upgrade provider distributions you can use your extended image.
  # Comment the image line, place your Dockerfile in the directory where you placed the docker-compose.yaml
  # and uncomment the "build" line below, Then run `docker-compose build` to build the images.
  # image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.2}
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__HOSTNAME_CALLABLE: 'airflow.utils.net.get_host_ip_address'
    AIRFLOW__CORE__PARALLELISM: '32'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '8'
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__WORKER_CONCURRENCY: '4'
    AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER: '1'
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__SCHEDULER__SCHEDULER_HEALTH_CHECK_THRESHOLD: '60'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # The following line can be used to set a custom config file, stored in the local config folder
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
    SCRAPINGANT_API_KEY: ${SCRAPINGANT_API_KEY:-}
    # --- KG stage (kym_kg, kym_kg_validate) ---
    # Collection names single-sourced here; the dashboard block repeats them.
    MONGODB_KG_NODES_COLLECTION: ${MONGODB_KG_NODES_COLLECTION:-kg_nodes}
    MONGODB_KG_EDGES_COLLECTION: ${MONGODB_KG_EDGES_COLLECTION:-kg_edges}
    MONGODB_KG_BUILDS_COLLECTION: ${MONGODB_KG_BUILDS_COLLECTION:-kg_builds}
    # Build directories (data/ is bind-mounted) and the tracked curated inputs.
    KG_DATA_DIR: /opt/airflow/data/kg
    KG_CONFIG_DIR: /opt/airflow/dags/kg_config
    # Graph stores the build is published into. A follower whose password is
    # unset is skipped, so the stage degrades to Mongo + files rather than
    # failing when a store is absent.
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    FUSEKI_URL: http://fuseki:3030
    FUSEKI_DATASET: kg
    FUSEKI_USER: admin
    FUSEKI_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-}
    # --- Model server (kg/semantics.py; replaced by openwebui_client in Phase 4) ---
    PAGODA_OLLAMA_URL: ${PAGODA_OLLAMA_URL:-}
    OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY:-}
    KG_CHAT_MODEL: ${KG_CHAT_MODEL:-}
    KG_EMBED_MODEL: ${KG_EMBED_MODEL:-}

  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/airflow/data
  user: "${AIRFLOW_UID:-1001}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER} # for the psql client
      PGPASSWORD: ${POSTGRES_PASSWORD} # for the psql client
      PGDATABASE: ${POSTGRES_DB} # for the psql client
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - Practice

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data-volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - Practice
  
  # STANDALONE — no replica set, so no multi-document transactions. The KG
  # stage (kg_store.py) is designed around that: generational build_id
  # namespaces plus one single-document pointer write, which is atomic even
  # here. Converting to a single-node replica set would not help, because the
  # atomicity problem also spans the filesystem and (Phase 3b) Neo4j/Fuseki.
  mongo:
    image: mongo:7.0
    # Explicit cache sizing rather than inferred. Mongo is cgroup-aware and
    # sizes WiredTiger's cache to ~50% of the limit minus 1 GB, floored at
    # 256 MB — so under the old 1 GB cap it ran a 256 MB cache. A full KG
    # build writes ~1M documents across two retained generations and builds
    # six compound indexes, which thrashes that.
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo-data-volume:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: always
    mem_limit: 2048m
    mem_reservation: 1024m
    networks:
      - Practice

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    # No host port: reached through the proxy on 8080. Other containers
    # still use http://airflow-apiserver:8080 on the Docker network.
    environment:
      <<: *airflow-common-env
      AIRFLOW__API__WORKERS: '1'
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    mem_limit: 1536m
    mem_reservation: 768m
    networks:
      - Practice
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    mem_limit: 1536m
    mem_reservation: 768m
    networks:
      - Practice
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
  
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    # --local, not --hostname "$HOSTNAME". Airflow 3 registers the job under
    # whatever `hostname_callable` returns — in Docker that is the container
    # IP (172.18.0.x), not the container id that $HOSTNAME holds — so the
    # hostname probe matched nothing and this service showed unhealthy for
    # weeks while the job heartbeated normally. --local resolves the name
    # through the same callable the job used, so they agree by construction.
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --local"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    restart: always
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - Practice
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always
    mem_limit: 768m
    mem_reservation: 384m
    networks:
      - Practice
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    restart: always
    mem_limit: 2048m
    mem_reservation: 1024m
    networks:
      - Practice
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    mem_limit: 256m
    mem_reservation: 128m
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config,data}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config,data}

    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _AIRFLOW__DAG_PROCESSOR__DAG_DIR_LIST_INTERVAL: '30'
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    networks:
      - Practice

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    networks:
      - Practice
    depends_on:
      <<: *airflow-common-depends-on

  # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # or by explicitly targeted on the command line e.g. docker-compose up flower.
  # See: https://docs.docker.com/compose/profiles/
  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - Practice
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
  # Read-only analytics UI over the pipeline's own collections. Separate
  # image from Airflow on purpose: different lifecycle, much smaller
  # dependency set, and it must never be able to write or create indexes.
  dashboard:
    build: ./dashboard
    container_name: kym_dashboard
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DB: ${MONGO_INITDB_DATABASE:-memes}
      # Same collection-name variables the stores use, so names stay
      # single-sourced here rather than duplicated in the dashboard code.
      MONGODB_URLS_COLLECTION: urls
      MONGODB_DOMS_COLLECTION: doms
      MONGODB_ENTRIES_COLLECTION: entries
      MONGODB_PARSE_FAILURES_COLLECTION: parse_failures
      MONGODB_RUN_SUMMARIES_COLLECTION: run_summaries
      MONGODB_KG_NODES_COLLECTION: ${MONGODB_KG_NODES_COLLECTION:-kg_nodes}
      MONGODB_KG_EDGES_COLLECTION: ${MONGODB_KG_EDGES_COLLECTION:-kg_edges}
      MONGODB_KG_BUILDS_COLLECTION: ${MONGODB_KG_BUILDS_COLLECTION:-kg_builds}
    ports:
      # Loopback only — the public route is http://<host>:8080/dashboard/.
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    restart: always
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - Practice
    depends_on:
      mongo:
        condition: service_healthy

  pgadmin:
    container_name: pgadmin_airflow
    image: elestio/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
      # The image binds gunicorn to [::] (IPv6) unless told otherwise. This
      # host has no IPv6, so pgAdmin exited on every start with
      # "Address family not supported by protocol".
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      # Served behind the proxy at http://<host>:8080/pgadmin/. gunicorn reads
      # SCRIPT_NAME, so the links pgAdmin generates carry the prefix.
      SCRIPT_NAME: /pgadmin
    ports:
      # Loopback only — the public route is http://<host>:8080/pgadmin/.
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      # Saved server connections and pgAdmin's own login database. Without
      # this, every recreate reset pgAdmin to a blank install.
      - pgadmin-data:/var/lib/pgadmin
    restart: always
    mem_limit: 512m
    mem_reservation: 128m
    networks:
      - Practice
    
  mongo-express:
    # Pinned: on `latest`, basic auth was only on because the image happened
    # to default ME_CONFIG_BASICAUTH=true. An image update could have
    # silently exposed full read-write database access.
    image: mongo-express:1.0.2
    container_name: mongo_express_airflow
    restart: always
    ports:
      # Loopback only — the public route is http://<host>:8080/mongo/.
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      # Web UI login. Set explicitly rather than relying on image defaults.
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:?set MONGO_EXPRESS_USER in .env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?set MONGO_EXPRESS_PASSWORD in .env}
      ME_CONFIG_SITE_SESSIONSECRET: ${MONGO_EXPRESS_SESSION_SECRET:?set MONGO_EXPRESS_SESSION_SECRET in .env}
      ME_CONFIG_SITE_BASEURL: /mongo/
    networks:
      - Practice
    depends_on:
      mongo:
        condition: service_healthy

  # --- KG graph stores -----------------------------------------------------
  # kym_kg publishes every build into both, generationally (see kg_store.py
  # and kg/loaders.py): a build is loaded under its build_id, then one
  # pointer write makes it current. Both are explicitly memory-capped; the
  # JVM defaults would size themselves off the host's 31 GB.

  # Neo4j Community: exactly one user database and no node-key constraints,
  # which is why the loader uses a build_id property plus a synthetic uid
  # rather than per-build databases. Bolt/Browser are loopback-only — the
  # campus firewall drops them anyway; tunnel BOTH ports to use the Browser.
  neo4j:
    image: neo4j:5.26-community
    container_name: kym_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data-volume:/data
      - neo4j-logs-volume:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: always
    mem_limit: 2048m
    mem_reservation: 1024m
    networks:
      - Practice

  # Fuseki (TDB2): the RDF store. FUSEKI_DATASET_1 creates the `kg` dataset
  # at first start. Writes are password-protected and only ever arrive over
  # the Docker network from the DAG; the public route (/sparql/ via Caddy)
  # refuses the admin and update paths outright.
  fuseki:
    image: stain/jena-fuseki:5.1.0
    container_name: kym_fuseki
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?set FUSEKI_ADMIN_PASSWORD in .env}
      FUSEKI_DATASET_1: kg
      # TDB2, not the image's TDB1 default: transactional, and what the
      # PUT-replaces-graph publish pattern in kg/loaders.py relies on. Must be
      # set before the FIRST start — the dataset persists in the volume and
      # the entrypoint skips creation once it exists, so it cannot be
      # converted later by changing this.
      TDB: "2"
      JVM_ARGS: -Xmx1500m -Xms512m
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - fuseki-data-volume:/fuseki
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3030/$$/ping >/dev/null || wget -qO- http://localhost:3030/$$/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    mem_limit: 2048m
    mem_reservation: 1024m
    networks:
      - Practice

  # The only service reachable from the network. The campus firewall in
  # front of this host drops most ports; 8080 gets through, so Airflow, the
  # dashboard, mongo-express and the SPARQL endpoint are all routed through
  # it. See proxy/Caddyfile.
  proxy:
    image: caddy:2.10-alpine
    container_name: kym_proxy
    ports:
      - "${PROXY_PORT:-8080}:8080"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: always
    mem_limit: 128m
    mem_reservation: 32m
    networks:
      - Practice
    depends_on:
      airflow-apiserver:
        condition: service_started
      dashboard:
        condition: service_started
      mongo-express:
        condition: service_started
      pgadmin:
        condition: service_started
      fuseki:
        condition: service_started

networks:
  Practice:
    name: airflow_network

volumes:
  postgres-db-volume:
  redis-data-volume:
  mongo-data-volume:
  pgadmin-data:
  neo4j-data-volume:
  neo4j-logs-volume:
  fuseki-data-volume:
