# kg_mapping.yarrrml.yml — MemeAtlas RDF mapping, an extension of IMKG
# ============================================================================
# MemeAtlas extends IMKG, the Internet Meme Knowledge Graph (Tommasini,
# Ilievski & Wijesiriwardene, ESWC 2023; github.com/riccardotommasini/imkg).
# Where IMKG already models something, its terms are reused VERBATIM, so an
# IMKG query runs unchanged here (compare kym/mappings/kym.media.frames.yaml
# in the IMKG repository). MemeAtlas additions live under `mk:` and are
# declared, with their alignments, in memeatlas.ttl next to this file. The
# full crosswalk is in MODEL.md.
#
# This mapping is the VALIDATION path, written by hand and independently of
# the Python serializer (modules/kg/rdf.py) that produces the published
# graph. kym_kg_validate compiles it with yatter, runs morph-kgc over the
# build's rml_data/*.csv (written by modules/kg/serialize.py), and diffs the
# output against graph.nt. The two must agree on every triple except the
# build's own provenance stamps. tests/test_kg_vocabulary.py checks that the
# predicates and classes used here are exactly those rdf.py emits, and that
# the sources below are exactly the files serialize.py writes.
#
# Conventions shared with IMKG: frame IRIs are the live KYM URL; no blank
# nodes; N-Triples output. Since 4.0.0 a node is only something that can be
# shared (a frame, a type, an image, a URL), and what belongs to one mention
# of a target is an RDF-star annotation on the quoted edge (the "occurrence"
# mappings below). The one exception is 6.0.0's mk:Event — a reified
# statement whose attributes must stay grouped; see MODEL.md.
#
# Deliberate differences from IMKG (also in rdf.py's docstring):
#   - m4s:year is xsd:integer and m4s:added / m4s:last_update_source are
#     xsd:dateTime (IMKG: untyped / xsd:timestamp, not an XSD type).
#   - The curated entry-type hierarchy is rdfs:subClassOf between the kymt:
#     classes. IMKG uses skos:broader between FRAMES for "Part of a series
#     on", and this mapping keeps that meaning for skos:broader alone.
#   - mk:badge (5.0.0) is an object property to a badge_concept resource,
#     not the literal it was in 4.0.0.
#
# 5.0.0: origin (frame.from) gets an ADDED canonicalization layer,
# origin_concept/mk:hasOrigin — NOT a "platform" concept; see
# kg_config/origin_taxonomy.yaml's header. badges move from a frame literal
# to badge_concept/mk:badge. tags get statistical mk:coOccursWith edges
# (kg/cooccurs.py) alongside plural-folding; entry_type does NOT (5.0.1 —
# judged needless alongside its curated subTypeOf hierarchy). Either way
# coOccursWith has no RDF mapping at all: tags are m4s:tag literals, no
# resource to attach a triple to — property-graph-only, unconditionally.
#
# 5.1.0: the Origin and Spread sections are no longer deferred. Their text
# maps to IMKG's m4s:origin / m4s:spread — DATATYPE properties, as IMKG
# keeps all three narrative sections as literals on the frame — and their
# images and link anchor text now flow through the same image_edges.csv /
# *_occurrences.csv as every other section's.
#
# RDF-star: each *_occurrences.csv has a row per mention. Its *_edge mapping
# is quotedNonAsserted (morph-kgc still asserts it; the same triple already
# comes from the edge CSV, and RDF is a set), and the annotation mapping over
# the SAME source quotes it row by row — no join condition needed. Verified
# end to end: yatter -> morph-kgc -> Fuseki 5.1 -> SPARQL-star.
#
# An empty CSV cell produces no triple (verified against morph-kgc), which
# is what lets optional fields share one wide CSV per entity. Never name a
# column subject/predicate/object/graph: morph-kgc uses those names
# internally and silently overwrites the value (every mk:hasImage subject
# once came out as <>).
#
# Run by hand (the DAG does this per build, cwd = the build directory):
#   python -m yatter -i kg_mapping.yarrrml.yml -o kg_mapping.rml.ttl
#   python -m morph_kgc morph_kgc.ini     # na_values MUST be empty

prefixes:
  m4s: "https://meme4.science/"
  mk: "https://meme4.science/atlas/"
  skos: "http://www.w3.org/2004/02/skos/core#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  xsd: "http://www.w3.org/2001/XMLSchema#"

mappings:

  # ---- IMKG: media frames ------------------------------------------------

  frame:
    sources:
      - [rml_data/frames.csv~csv]
    subjects: $(url)
    po:
      - [a, m4s:MediaFrame]
      - [a, https://knowyourmeme.com/memes/$(category_class)~iri]
      - [m4s:title, $(title)]
      - [rdfs:label, $(title)]
      - [m4s:status, $(status)]
      - [m4s:year, $(year), xsd:integer]
      - [m4s:from, $(from)]
      - [m4s:about, $(about)]
      - [m4s:origin, $(origin_text)]
      - [m4s:spread, $(spread_text)]
      - [m4s:added, $(added), xsd:dateTime]
      - [m4s:last_update_source, $(last_updated), xsd:dateTime]
      - [mk:description, $(description)]
      - [mk:corpusStatus, $(corpus_status)]
      - [mk:parserVersion, $(parser_version)]
      - [mk:parsedAt, $(parsed_at), xsd:dateTime]
      - [mk:scrapedAt, $(scraped_at), xsd:dateTime]

  frame_alias:
    sources:
      - [rml_data/frame_aliases.csv~csv]
    subjects: $(url)
    po:
      - [skos:altLabel, $(alias)]

  frame_section_text:
    sources:
      - [rml_data/frame_section_texts.csv~csv]
    subjects: $(url)
    po:
      - [mk:sectionText, $(text)]

  frame_corpus_missing:
    sources:
      - [rml_data/frame_corpus_missing.csv~csv]
    subjects: $(url)
    po:
      - [mk:corpusMissing, $(missing)]

  # IMKG: entry types are classes of the frame.
  has_entry_type:
    sources:
      - [rml_data/entry_type_edges.csv~csv]
    subjects: $(url)
    po:
      - [a, https://knowyourmeme.com/types/$(slug)~iri]

  # IMKG: tags are plain literals.
  has_tag:
    sources:
      - [rml_data/tag_edges.csv~csv]
    subjects: $(url)
    po:
      - [m4s:tag, $(tag)]

  # IMKG: "Part of a series on X" is skos:broader, with the inverse emitted.
  part_of_series:
    sources:
      - [rml_data/series_edges.csv~csv]
    subjects: $(url)
    po:
      - [skos:broader, $(parent_url)~iri]

  part_of_series_inverse:
    sources:
      - [rml_data/series_edges.csv~csv]
    subjects: $(parent_url)
    po:
      - [skos:narrower, $(url)~iri]

  # ---- MemeAtlas: the entry-type taxonomy ---------------------------------

  entry_type_concept:
    sources:
      - [rml_data/types.csv~csv]
    subjects: https://knowyourmeme.com/types/$(slug)
    po:
      - [a, rdfs:Class]
      - [a, skos:Concept]
      - [skos:inScheme, mk:EntryTypeScheme~iri]
      - [skos:prefLabel, $(label)]

  # One mapping, three rows: scheme.csv holds entry_type's, origin's and
  # badge's concept scheme, one row each (kg/serialize.py). The mapping
  # itself doesn't care which scheme a row is -- $(iri)/$(label) alone.
  concept_scheme:
    sources:
      - [rml_data/scheme.csv~csv]
    subjects: $(iri)
    po:
      - [a, skos:ConceptScheme]
      - [rdfs:label, $(label)]

  entry_type_subtype:
    sources:
      - [rml_data/subtype_edges.csv~csv]
    subjects: https://knowyourmeme.com/types/$(narrower)
    po:
      - [rdfs:subClassOf, https://knowyourmeme.com/types/$(broader)~iri]

  # coOccursWith (kg/cooccurs.py) has no mapping here at all (5.0.1):
  # entry_type's statistical edges were removed (needless alongside its
  # curated subTypeOf hierarchy above), and tags -- the only remaining
  # source -- have no RDF resource (tags are m4s:tag literals). So
  # coOccursWith is property-graph-only, unconditionally; see MODEL.md.

  # ---- MemeAtlas: the origin taxonomy (kg/origin.py) ----------------------
  # NOT a "platform" concept: origin values include countries, franchises,
  # companies and people, all canonicalized here. The curated subClassOf
  # hierarchy below covers only the platform-like subset -- see
  # kg_config/origin_taxonomy.yaml's header and kg/origin.py's docstring.

  origin_concept:
    sources:
      - [rml_data/origin_concepts.csv~csv]
    subjects: https://meme4.science/atlas/origin/$(slug)
    po:
      - [a, skos:Concept]
      - [skos:inScheme, mk:OriginScheme~iri]
      - [skos:prefLabel, $(label)]

  origin_subtype:
    sources:
      - [rml_data/origin_subtype_edges.csv~csv]
    subjects: https://meme4.science/atlas/origin/$(narrower)
    po:
      - [rdfs:subClassOf, https://meme4.science/atlas/origin/$(broader)~iri]

  has_origin:
    sources:
      - [rml_data/origin_edges.csv~csv]
    subjects: $(url)
    po:
      - [mk:hasOrigin, https://meme4.science/atlas/origin/$(origin)~iri]

  # ---- MemeAtlas: the badge taxonomy ---------------------------------------

  badge_concept:
    sources:
      - [rml_data/badge_concepts.csv~csv]
    subjects: https://meme4.science/atlas/badge/$(slug)
    po:
      - [a, skos:Concept]
      - [skos:inScheme, mk:BadgeScheme~iri]
      - [skos:prefLabel, $(label)]

  has_badge:
    sources:
      - [rml_data/badge_edges.csv~csv]
    subjects: $(url)
    po:
      - [mk:badge, https://meme4.science/atlas/badge/$(badge)~iri]

  # ---- MemeAtlas: relations IMKG does not model ---------------------------

  has_region:
    sources:
      - [rml_data/region_edges.csv~csv]
    subjects: $(url)
    po:
      - [mk:region, $(region)]

  relates_to_meme:
    sources:
      - [rml_data/relates_edges.csv~csv]
    subjects: $(url)
    po:
      - [mk:relatesToMeme, $(target_url)~iri]

  cites_external:
    sources:
      - [rml_data/cites_edges.csv~csv]
    subjects: $(url)
    po:
      - [mk:citesExternal, $(target_url)~iri]

  # ---- MemeAtlas: images --------------------------------------------------

  image:
    sources:
      - [rml_data/images.csv~csv]
    subjects: $(iri)
    po:
      - [a, mk:Image]
      - [mk:width, $(width), xsd:integer]
      - [mk:height, $(height), xsd:integer]

  has_image:
    sources:
      - [rml_data/image_edges.csv~csv]
    subjects: $(url)
    po:
      - [mk:hasImage, $(image)~iri]

  # ---- MemeAtlas: events extracted from the Origin/Spread narrative (6.0.0) --
  # The one IRI MemeAtlas mints for page-derived content. The id is minted
  # by modules/kg/events.py and stored, so both paths read the same string
  # rather than each deriving it. mk:Event is aligned to sem:Event and
  # schema:Event in memeatlas.ttl and neither is emitted here — the same
  # treatment mk:Image gets against schema:ImageObject.
  #
  # There is no `date` column on purpose: the event's date reaches RDF only
  # as the (eventStart, eventEnd) interval plus mk:datePrecision. See
  # modules/kg/rdf.py's NODE_LITERALS["event"].
  event:
    sources:
      - [rml_data/events.csv~csv]
    subjects: $(iri)
    po:
      - [a, mk:Event]
      - [mk:sourceText, $(source_text)]
      - [mk:sourceSection, $(source_section)]
      - [mk:datePrecision, $(date_precision)]
      - [mk:dateBasis, $(date_basis)]
      - [mk:dateText, $(date_text)]
      - [mk:eventStart, $(date_start), xsd:dateTime]
      - [mk:eventEnd, $(date_end), xsd:dateTime]
      - [mk:eventLocation, $(location)]
      - [mk:locationType, $(location_type)]
      - [mk:certainty, $(certainty)]
      - [mk:extractionModel, $(extraction_model)]
      - [mk:extractionVersion, $(extraction_version)]

  # SEM's fourth question. One row per actor, like frame_aliases.csv —
  # keyed by the event IRI rather than by a frame url.
  event_actor:
    sources:
      - [rml_data/event_actors.csv~csv]
    subjects: $(iri)
    po:
      - [mk:eventActor, $(actor)]

  has_event:
    sources:
      - [rml_data/event_edges.csv~csv]
    subjects: $(url)
    po:
      - [mk:hasEvent, https://meme4.science/atlas/event/$(event)~iri]

  # What an event was attached to BY POSITION (extraction 2.0.0) — the
  # links inside its sentences, the references its [n] markers cite, and
  # the embeds and photos shown with its paragraph. Never the model's pick.
  event_link:
    sources:
      - [rml_data/event_link_edges.csv~csv]
    subjects: https://meme4.science/atlas/event/$(event)
    po:
      - [mk:eventLink, $(target_url)~iri]

  event_citation:
    sources:
      - [rml_data/event_citation_edges.csv~csv]
    subjects: https://meme4.science/atlas/event/$(event)
    po:
      - [mk:eventCitation, $(target_url)~iri]

  event_embed:
    sources:
      - [rml_data/event_embed_edges.csv~csv]
    subjects: https://meme4.science/atlas/event/$(event)
    po:
      - [mk:eventEmbed, $(target_url)~iri]

  event_image:
    sources:
      - [rml_data/event_image_edges.csv~csv]
    subjects: https://meme4.science/atlas/event/$(event)
    po:
      - [mk:eventImage, $(image)~iri]

  # A date worked out from "that same day" points at the event it was
  # counted from (extraction 2.1.0).
  event_date_anchor:
    sources:
      - [rml_data/event_date_anchor_edges.csv~csv]
    subjects: https://meme4.science/atlas/event/$(event)
    po:
      - [mk:dateAnchoredTo, https://meme4.science/atlas/event/$(anchor)~iri]

  # ---- MemeAtlas: occurrences, as RDF-star annotations -----------------------

  relates_occurrence_edge:
    sources:
      - [rml_data/relates_occurrences.csv~csv]
    subjects: $(src)
    po:
      - [mk:relatesToMeme, $(dst)~iri]

  relates_occurrence:
    sources:
      - [rml_data/relates_occurrences.csv~csv]
    subjects:
      - quotedNonAsserted: relates_occurrence_edge
    po:
      - [mk:anchorText, $(anchor_text)]
      - [mk:inSection, $(in_section)]
      - [mk:citationText, $(citation_text)]
      - [mk:citationIndex, $(citation_index), xsd:integer]
      - [mk:siteName, $(site_name)]

  cites_occurrence_edge:
    sources:
      - [rml_data/cites_occurrences.csv~csv]
    subjects: $(src)
    po:
      - [mk:citesExternal, $(dst)~iri]

  cites_occurrence:
    sources:
      - [rml_data/cites_occurrences.csv~csv]
    subjects:
      - quotedNonAsserted: cites_occurrence_edge
    po:
      - [mk:anchorText, $(anchor_text)]
      - [mk:inSection, $(in_section)]
      - [mk:citationText, $(citation_text)]
      - [mk:citationIndex, $(citation_index), xsd:integer]
      - [mk:siteName, $(site_name)]

  image_occurrence_edge:
    sources:
      - [rml_data/image_occurrences.csv~csv]
    subjects: $(src)
    po:
      - [mk:hasImage, $(dst)~iri]

  image_occurrence:
    sources:
      - [rml_data/image_occurrences.csv~csv]
    subjects:
      - quotedNonAsserted: image_occurrence_edge
    po:
      - [mk:imageRole, $(role)]
      - [mk:inSection, $(in_section)]
      - [mk:altText, $(alt_text)]
      - [mk:caption, $(caption)]
