deny_classes:
  # classes whose members are never what a meme is about — kept short on
  # purpose; everything uncertain goes to the judge
  - {qid: Q112826905, label: class of anatomical entity, rationale: "face, hand, eye, hair, vein: the picture being described"}
  - {qid: Q39875001,  label: measure, rationale: "popularity"}
  - {qid: Q24034552,  label: mathematical concept, rationale: "number, shape, the maths senses of series/image"}

deny_items:
